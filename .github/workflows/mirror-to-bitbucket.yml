name: Mirror onprem-viewer → Bitbucket Onprem

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/onprem-viewer/**"

jobs:
  mirror-onprem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Create split branch from apps/onprem-viewer
        run: |
          git branch -D onprem-split || true
          git subtree split --prefix=apps/onprem-viewer -b onprem-split

      - name: Push split branch to flexboard-onprem
        env:
          BB_USERNAME: ${{ secrets.BB_USERNAME }}
          BB_APP_PASSWORD: ${{ secrets.BB_APP_PASSWORD }}
        run: |
          git remote remove bitbucket 2>/dev/null || true
          git remote add bitbucket https://${BB_USERNAME}:${BB_APP_PASSWORD}@bitbucket.org/digitalvalueth/flexboard-onprem.git

          # Push ไปที่ branch เดียวกับที่ trigger (main หรือ dev)
          git push --force bitbucket onprem-split:${{ github.ref_name }}
