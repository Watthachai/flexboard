substitutions:
  _REGION: asia-southeast1
  _REPO: flexboard
  _SERVICE: control-plane-api
  _DIR: apps/control-plane-api
  # Firebase configuration - these should be set in Cloud Build trigger
  _FIREBASE_PROJECT_ID: # Set in Cloud Build trigger
  _FIREBASE_PRIVATE_KEY_ID: # Set in Cloud Build trigger  
  _FIREBASE_PRIVATE_KEY: # Set in Cloud Build trigger
  _FIREBASE_CLIENT_EMAIL: # Set in Cloud Build trigger
  _FIREBASE_CLIENT_ID: # Set in Cloud Build trigger
  # JWT Secret for authentication
  _JWT_SECRET: # Set in Cloud Build trigger

steps:
  # Build and tag the Docker image with Kaniko + Cache
  - name: gcr.io/kaniko-project/executor:latest
    args:
      - '--dockerfile=${_DIR}/Dockerfile'
      - '--context=.'
      - '--destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '--destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/cache'
      - '--use-new-run'
      - '--snapshot-mode=redo'

  # Deploy to Cloud Run (Production)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'NODE_ENV=production,ENVIRONMENT=production,HOST=0.0.0.0,CORS_ORIGINS=*,JWT_SECRET=${_JWT_SECRET},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_PRIVATE_KEY_ID=${_FIREBASE_PRIVATE_KEY_ID},FIREBASE_CLIENT_EMAIL=${_FIREBASE_CLIENT_EMAIL},FIREBASE_CLIENT_ID=${_FIREBASE_CLIENT_ID},FIREBASE_PRIVATE_KEY=${_FIREBASE_PRIVATE_KEY}'

# Store the built images
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY