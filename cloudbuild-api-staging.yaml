substitutions:
  _REGION: asia-southeast1
  _REPO: flexboard
  _SERVICE: control-plane-api-staging
  _DIR: apps/control-plane-api
  # Firebase configuration - these should be set in Cloud Build trigger
  _FIREBASE_PROJECT_ID: # Set in Cloud Build trigger
  _FIREBASE_PRIVATE_KEY_ID: # Set in Cloud Build trigger  
  _FIREBASE_PRIVATE_KEY: # Set in Cloud Build trigger
  _FIREBASE_CLIENT_EMAIL: # Set in Cloud Build trigger
  _FIREBASE_CLIENT_ID: # Set in Cloud Build trigger
  # JWT Secret for authentication
  _JWT_SECRET: # Set in Cloud Build trigger

steps:
  # Build and tag the Docker image
  - name: gcr.io/cloud-builders/docker
    args: 
      - 'build'
      - '-f'
      - '${_DIR}/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:staging-latest'
      - '.'

  # Push the Docker image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args: 
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'

  - name: gcr.io/cloud-builders/docker
    args: 
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:staging-latest'

  # Deploy to Cloud Run (Staging)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'NODE_ENV=staging,ENVIRONMENT=staging,HOST=0.0.0.0,PORT=8080,JWT_SECRET=${_JWT_SECRET},FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_PRIVATE_KEY_ID=${_FIREBASE_PRIVATE_KEY_ID},FIREBASE_CLIENT_EMAIL=${_FIREBASE_CLIENT_EMAIL},FIREBASE_CLIENT_ID=${_FIREBASE_CLIENT_ID},FIREBASE_PRIVATE_KEY=${_FIREBASE_PRIVATE_KEY}'

# Store the built images
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:staging-latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
