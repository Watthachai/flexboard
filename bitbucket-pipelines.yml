image: google/cloud-sdk:slim

options:
  size: 2x # ถ้า build ใหญ่ เพิ่มทรัพยากร

pipelines:
  branches:
    dev:
      - step:
          name: Control Plane UI → Cloud Run (DEV)
          deployment: dev
          caches: []
          script:
            # Check if UI files changed
            - git diff --name-only HEAD~1..HEAD | grep '^apps/control-plane-ui/' || { echo "No UI changes detected, skipping UI deployment"; exit 0; }
            
            # GCP Authentication
            - echo "$GCP_SA_KEY_BASE64" | base64 -d > /tmp/key.json
            - gcloud auth activate-service-account "$GCP_SA_EMAIL" --key-file=/tmp/key.json
            - gcloud config set project "$GCP_PROJECT"
            - gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" -q

            # Build & Push
            - export UI_IMG="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/control-plane-ui:${BITBUCKET_COMMIT}"
            - gcloud builds submit ./apps/control-plane-ui --tag "$UI_IMG"

            # Deploy to Cloud Run
            - gcloud run deploy control-plane-ui-dev \
                --image "$UI_IMG" \
                --region "$GCP_REGION" \
                --platform managed \
                --allow-unauthenticated \
                --port 8080 \
                --max-instances 10 \
                --memory 1Gi \
                --cpu 1 \
                --set-env-vars "NODE_ENV=production,NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL_DEV}"

      - step:
          name: Control Plane API → Cloud Run (DEV)
          deployment: dev
          caches: []
          script:
            # Check if API files changed
            - git diff --name-only HEAD~1..HEAD | grep '^apps/control-plane-api/' || { echo "No API changes detected, skipping API deployment"; exit 0; }
            
            # GCP Authentication
            - echo "$GCP_SA_KEY_BASE64" | base64 -d > /tmp/key.json
            - gcloud auth activate-service-account "$GCP_SA_EMAIL" --key-file=/tmp/key.json
            - gcloud config set project "$GCP_PROJECT"
            - gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" -q

            # Build & Push
            - export API_IMG="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/control-plane-api:${BITBUCKET_COMMIT}"
            - gcloud builds submit ./apps/control-plane-api --tag "$API_IMG"

            # Deploy to Cloud Run
            - gcloud run deploy control-plane-api-dev \
                --image "$API_IMG" \
                --region "$GCP_REGION" \
                --platform managed \
                --allow-unauthenticated \
                --port 8080 \
                --max-instances 10 \
                --memory 1Gi \
                --cpu 1 \
                --set-env-vars "NODE_ENV=production,DATABASE_URL=${DATABASE_URL_DEV},JWT_SECRET=${JWT_SECRET_DEV},CORS_ORIGIN=${CORS_ORIGIN_DEV}"



    main:
      - step:
          name: Control Plane UI → Cloud Run (PRODUCTION)
          deployment: production
          script:
            # GCP Authentication
            - echo "$GCP_SA_KEY_BASE64" | base64 -d > /tmp/key.json
            - gcloud auth activate-service-account "$GCP_SA_EMAIL" --key-file=/tmp/key.json
            - gcloud config set project "$GCP_PROJECT"
            - gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" -q

            # Build & Push
            - export UI_IMG="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/control-plane-ui:${BITBUCKET_COMMIT}"
            - gcloud builds submit ./apps/control-plane-ui --tag "$UI_IMG"

            # Deploy to Cloud Run
            - gcloud run deploy control-plane-ui \
                --image "$UI_IMG" \
                --region "$GCP_REGION" \
                --platform managed \
                --allow-unauthenticated \
                --port 8080 \
                --max-instances 20 \
                --memory 2Gi \
                --cpu 2 \
                --set-env-vars "NODE_ENV=production,NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL_PRODUCTION}"

      - step:
          name: Control Plane API → Cloud Run (PRODUCTION)
          deployment: production
          script:
            # GCP Authentication
            - echo "$GCP_SA_KEY_BASE64" | base64 -d > /tmp/key.json
            - gcloud auth activate-service-account "$GCP_SA_EMAIL" --key-file=/tmp/key.json
            - gcloud config set project "$GCP_PROJECT"
            - gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" -q

            # Build & Push
            - export API_IMG="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT/$AR_REPO/control-plane-api:${BITBUCKET_COMMIT}"
            - gcloud builds submit ./apps/control-plane-api --tag "$API_IMG"

            # Deploy to Cloud Run
            - gcloud run deploy control-plane-api \
                --image "$API_IMG" \
                --region "$GCP_REGION" \
                --platform managed \
                --allow-unauthenticated \
                --port 8080 \
                --max-instances 20 \
                --memory 2Gi \
                --cpu 2 \
                --set-env-vars "NODE_ENV=production,DATABASE_URL=${DATABASE_URL_PRODUCTION},JWT_SECRET=${JWT_SECRET_PRODUCTION},CORS_ORIGIN=${CORS_ORIGIN_PRODUCTION}"

