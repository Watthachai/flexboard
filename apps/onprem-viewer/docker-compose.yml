version: "3.8"

services:
  onprem-viewer:
    build: .
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/database.db
    volumes:
      - ./data:/app/data
      - ./inventory-files:/app/inventory-files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
  inventory-files:
