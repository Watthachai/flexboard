# cloudbuild-ui.yaml  (MAIN / PRODUCTION)
substitutions:
  _REGION: asia-southeast1
  _REPO: flexboard
  _SERVICE: control-plane-ui            # 👈 ชื่อ service โปรดักชัน (UI main)
  _DIR: apps/control-plane-ui

steps:
  # 1) Build & Push image ด้วย Kaniko + Cache
  - name: gcr.io/kaniko-project/executor:latest
    args:
      - '--dockerfile=${_DIR}/Dockerfile'
      - '--context=.'  # root ของ repo (/workspace)
      - '--destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '--destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '--cache=true'
      - '--cache-ttl=168h'  # 7 วัน
      - '--cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}-cache'
      - '--snapshot-mode=redo'

  # 2) Deploy ไป Cloud Run (Production)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'NODE_ENV=production,ENVIRONMENT=production,HOST=0.0.0.0,NEXT_PUBLIC_ENVIRONMENT=production,NEXT_PUBLIC_API_URL=https://api-flexboard.fittcoreai.com'

# ให้ Cloud Build บันทึก metadata ของ image ที่สร้าง
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY