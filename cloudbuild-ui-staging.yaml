substitutions:
  _REGION: asia-southeast1
  _REPO: flexboard
  _SERVICE: control-plane-ui-staging
  _DIR: apps/control-plane-ui

steps:
  # Build and tag the Docker image with Kaniko + Cache
  - name: gcr.io/kaniko-project/executor:latest
    args:
      - '--dockerfile=${_DIR}/Dockerfile'
      - '--context=.'
      - '--destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '--destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:staging-latest'
      - '--cache=true'
      - '--cache-ttl=168h'
      - '--cache-repo=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/cache'
      - '--use-new-run'
      - '--snapshot-mode=redo'

  # Deploy to Cloud Run (Staging)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'NODE_ENV=staging,ENVIRONMENT=staging,HOST=0.0.0.0,NEXT_PUBLIC_ENVIRONMENT=staging,NEXT_PUBLIC_API_URL=https://sandbox.api-flexboard.fittcoreai.com'

# Store the built images
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:staging-latest'
