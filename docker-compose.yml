version: '3.8'

services:
  # Service สำหรับ Control Plane API
  control-plane-api:
    build:
      context: ./apps/control-plane-api
      dockerfile: Dockerfile
    container_name: flexboard-control-plane-api
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: 3000
      # Firebase Configuration
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
      FIREBASE_PRIVATE_KEY: "${FIREBASE_PRIVATE_KEY}"
      FIREBASE_CLIENT_EMAIL: "${FIREBASE_CLIENT_EMAIL}"
    ports:
      - "3000:3000"
    networks:
      - flexboard-net

  # Service สำหรับ Control Plane UI
  control-plane-ui:
    build:
      context: ./apps/control-plane-ui
      dockerfile: Dockerfile
    container_name: flexboard-control-plane-ui
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://control-plane-api:3000"
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - control-plane-api
    networks:
      - flexboard-net

  # Service สำหรับ OnPrem Viewer UI
  onprem-viewer-ui:
    build:
      context: ./apps/onprem-viewer-ui
      dockerfile: Dockerfile
    container_name: flexboard-viewer-ui
    restart: unless-stopped
    environment:
      # เรียก Control Plane API โดยตรง
      NEXT_PUBLIC_API_URL: "http://control-plane-api:3000"
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      - control-plane-api
    networks:
      - flexboard-net

# กำหนด Network กลาง
networks:
  flexboard-net:
    driver: bridge